<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Kumar — The Studio Book</title>
<style>
  :root {
    --desk: #17130f;
    --desk-light: #221c16;
    --paper: #efe7d6;
    --paper-2: #e6dcc7;
    --paper-edge: #d6cab0;
    --ink: #1f1a14;
    --ink-soft: #4a4238;
    --muted: #7d7264;
    --brass: #b08d57;
    --brass-bright: #d4a96a;
    --brass-dark: #7a5f38;
    --spine: #2c2118;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--desk);
    color: var(--ink);
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    overflow: hidden;
    cursor: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     CUSTOM CURSOR — a brass reading lens
     ============================================================ */
  .cursor-lens {
    position: fixed; top: 0; left: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--brass);
    background: radial-gradient(circle, rgba(176,141,87,0.06), transparent 70%);
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%,-50%);
    transition: width .4s cubic-bezier(.16,1,.3,1),
                height .4s cubic-bezier(.16,1,.3,1),
                border-color .3s ease,
                background .3s ease;
    mix-blend-mode: difference;
  }
  .cursor-pin {
    position: fixed; top: 0; left: 0;
    width: 4px; height: 4px;
    background: var(--brass-bright);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 6px rgba(212,169,106,0.8);
  }
  body.hovering .cursor-lens {
    width: 72px; height: 72px;
    border-color: var(--brass-bright);
    background: radial-gradient(circle, rgba(212,169,106,0.12), transparent 70%);
  }
  body.clicking .cursor-lens {
    width: 26px; height: 26px;
  }

  /* ============================================================
     THE DESK — ambient scene beneath the book
     ============================================================ */
  .desk {
    position: fixed; inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 42%, var(--desk-light) 0%, var(--desk) 55%, #0d0a07 100%);
  }
  /* The single lamp beam falling on the book */
  .desk::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 45% 38% at 50% 45%, rgba(255,220,160,0.10), transparent 70%);
    mix-blend-mode: screen;
    animation: lampBreath 8s ease-in-out infinite;
  }
  @keyframes lampBreath {
    0%,100% { opacity: 0.85; }
    50% { opacity: 1; }
  }
  /* Faint dust motes drifting in the lamp light */
  .desk::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image:
      radial-gradient(circle at 42% 38%, rgba(255,230,180,0.4) 0.5px, transparent 1.5px),
      radial-gradient(circle at 58% 52%, rgba(255,230,180,0.3) 0.5px, transparent 1.5px),
      radial-gradient(circle at 48% 60%, rgba(255,230,180,0.35) 0.5px, transparent 1.5px),
      radial-gradient(circle at 62% 42%, rgba(255,230,180,0.25) 0.5px, transparent 1.5px),
      radial-gradient(circle at 38% 55%, rgba(255,230,180,0.3) 0.5px, transparent 1.5px);
    background-size: 100% 100%;
    animation: moteDrift 28s linear infinite;
  }
  @keyframes moteDrift {
    0% { transform: translate(0,0); }
    100% { transform: translate(-2%, -3%); }
  }

  /* ============================================================
     THE BOOK — two pages, bound at the spine
     ============================================================ */
  .book {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(88vw, 1180px);
    height: min(80vh, 720px);
    z-index: 5;
    perspective: 2400px;
    pointer-events: none;
  }

  /* The book's cast shadow — grounding it on the desk */
  .book-shadow {
    position: absolute;
    left: 4%;
    right: 4%;
    bottom: -3%;
    height: 10%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.7), transparent 70%);
    filter: blur(20px);
    z-index: -1;
  }

  /* The two pages */
  .page {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    overflow: hidden;
    pointer-events: auto;
    box-shadow:
      inset 0 0 60px rgba(120, 100, 60, 0.08),
      0 0 1px rgba(0,0,0,0.1);
    transition: transform 1.1s cubic-bezier(.7,0,.3,1),
                box-shadow 1.1s cubic-bezier(.7,0,.3,1);
  }
  .page-left {
    left: 0;
    border-radius: 4px 0 0 4px;
    transform-origin: right center;
    box-shadow:
      inset -30px 0 40px -30px rgba(60, 40, 20, 0.25),
      inset 0 0 60px rgba(120, 100, 60, 0.08);
  }
  .page-right {
    right: 0;
    border-radius: 0 4px 4px 0;
    transform-origin: left center;
    box-shadow:
      inset 30px 0 40px -30px rgba(60, 40, 20, 0.25),
      inset 0 0 60px rgba(120, 100, 60, 0.08);
  }

  /* The spine — a dark brass-bound gutter between the pages */
  .spine {
    position: absolute;
    top: -1%;
    bottom: -1%;
    left: 50%;
    width: 26px;
    transform: translateX(-50%);
    background: linear-gradient(90deg,
      var(--spine) 0%,
      #3d2e20 35%,
      #2c2118 50%,
      #3d2e20 65%,
      var(--spine) 100%);
    box-shadow:
      inset 0 0 20px rgba(0,0,0,0.6),
      0 0 14px rgba(0,0,0,0.5);
    z-index: 10;
    pointer-events: none;
    border-radius: 2px;
  }
  /* A brass rule running down the spine */
  .spine::before {
    content: '';
    position: absolute;
    top: 4%;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    background: linear-gradient(180deg,
      transparent,
      var(--brass) 15%,
      var(--brass-bright) 50%,
      var(--brass) 85%,
      transparent);
    opacity: 0.55;
  }

  /* Paper grain on each page */
  .page::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
  }

  /* ============================================================
     PAGE CONTENT — chapter layout
     ============================================================ */
  .chapter {
    position: absolute;
    inset: 0;
    padding: clamp(2.2rem, 4.5vw, 4.5rem) clamp(2rem, 4vw, 4rem);
    display: flex;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    transition: opacity .55s ease, transform .55s ease;
    transform: translateY(8px);
  }
  .chapter.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    transition: opacity .8s ease .25s, transform .8s cubic-bezier(.16,1,.3,1) .25s;
  }

  /* Chapter number — a running folio in brass */
  .folio {
    font-family: 'Courier New', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.32em;
    color: var(--brass);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .folio::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--brass);
    opacity: 0.25;
  }
  .page-right .folio {
    flex-direction: row-reverse;
  }
  .page-right .folio::after {
    order: 0;
  }

  /* Chapter title — big serif, set like a book title */
  .chapter-title {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-weight: 400;
    font-size: clamp(2rem, 4.4vw, 3.6rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 1.4rem;
  }
  .chapter-title em {
    font-style: italic;
    color: var(--brass-dark);
  }

  /* A small upright rule under the title */
  .chapter-rule {
    width: 36px;
    height: 1px;
    background: var(--brass);
    margin-bottom: 1.6rem;
  }
  .page-right .chapter-rule {
    margin-left: auto;
  }

  /* Body copy in the book */
  .chapter-body {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 1.12rem;
    line-height: 1.7;
    color: var(--ink-soft);
    max-width: 34ch;
    text-align: justify;
    hyphens: auto;
  }
  .page-right .chapter-body {
    margin-left: auto;
  }
  .chapter-body strong {
    color: var(--ink);
    font-weight: 600;
  }

  /* Running list of skills, set like a book's index */
  .index-list {
    margin-top: auto;
    padding-top: 2rem;
    border-top: 1px solid rgba(31,26,20,0.12);
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .index-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .index-list li span:last-child {
    color: var(--brass-dark);
    font-weight: 600;
  }
  .index-list li::before {
    content: none;
  }

  /* Drop cap on the hero chapter */
  .drop-cap::first-letter {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 3.6em;
    float: left;
    line-height: 0.85;
    padding: 0.06em 0.12em 0 0;
    color: var(--brass-dark);
    font-weight: 500;
  }

  /* Hero (chapter 0) is special — a title page */
  .title-page {
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .title-page .folio {
    justify-content: center;
  }
  .title-page .folio::after { display: none; }
  .title-page .title-eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.6rem;
  }
  .title-page .title-main {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-weight: 400;
    font-size: clamp(2.8rem, 6.5vw, 5.4rem);
    line-height: 0.94;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin-bottom: 1.2rem;
  }
  .title-page .title-main em {
    font-style: italic;
    color: var(--brass-dark);
  }
  .title-page .title-rule {
    width: 48px;
    height: 1px;
    background: var(--brass);
    margin: 0 auto 1.4rem;
  }
  .title-page .title-sub {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--ink-soft);
    max-width: 30ch;
    line-height: 1.6;
    margin: 0 auto;
  }
  .title-page .title-imprint {
    margin-top: 2.4rem;
    font-family: 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Contact chapter */
  .contact-link {
    display: inline-block;
    margin-top: 1.6rem;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--brass);
    padding-bottom: 4px;
    transition: color .3s ease, border-color .3s ease;
    cursor: none;
  }
  .contact-link:hover {
    color: var(--brass-dark);
    border-color: var(--brass-bright);
  }

  /* ============================================================
     NAVIGATION — bookmarks and page turner, outside the book
     ============================================================ */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 2rem 2.6rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    color: var(--paper);
    mix-blend-mode: difference;
  }
  .topbar .brand {
    pointer-events: auto;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: var(--paper);
  }
  .topbar .brand em {
    font-style: italic;
    color: var(--brass-bright);
  }
  .topbar .pagination {
    pointer-events: auto;
    font-family: 'Courier New', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--paper);
    opacity: 0.7;
  }

  /* Bookmark tabs on the right — the chapter index */
  .bookmarks {
    position: fixed;
    right: 2.2rem;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    pointer-events: auto;
  }
  .bookmark {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.8rem;
    background: none;
    border: none;
    cursor: none;
    font-family: 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(239, 231, 214, 0.35);
    transition: color .3s ease, gap .3s ease;
    padding: 0.2rem 0;
  }
  .bookmark .bm-line {
    width: 18px;
    height: 1px;
    background: rgba(239, 231, 214, 0.3);
    transition: width .4s cubic-bezier(.16,1,.3,1), background .3s ease;
  }
  .bookmark .bm-label {
    opacity: 0;
    transform: translateX(6px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .bookmark:hover {
    color: var(--paper);
  }
  .bookmark:hover .bm-line {
    width: 30px;
    background: var(--brass-bright);
  }
  .bookmark:hover .bm-label {
    opacity: 1;
    transform: translateX(0);
  }
  .bookmark.active {
    color: var(--brass-bright);
  }
  .bookmark.active .bm-line {
    width: 34px;
    background: var(--brass-bright);
  }
  .bookmark.active .bm-label {
    opacity: 1;
    transform: translateX(0);
  }

  /* Page-turn hint in the corner */
  .turn-hint {
    position: fixed;
    bottom: 2.4rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-family: 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(239, 231, 214, 0.4);
    display: flex;
    align-items: center;
    gap: 0.9rem;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  .turn-hint::before,
  .turn-hint::after {
    content: '';
    width: 30px;
    height: 1px;
    background: rgba(239, 231, 214, 0.3);
  }
  .turn-hint.hide { opacity: 0; }

  /* ============================================================
     ENTER — opening the book
     ============================================================ */
  .enter-screen {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: var(--desk);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    transition: opacity 1.4s cubic-bezier(.16,1,.3,1), visibility 1.4s;
  }
  .enter-screen.gone {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .enter-eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--brass);
    opacity: 0;
    animation: fadeUp 1s .3s ease forwards;
  }
  .enter-title {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 6vw, 4rem);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--paper);
    text-align: center;
    opacity: 0;
    animation: fadeUp 1.2s .5s ease forwards;
  }
  .enter-title em {
    font-style: italic;
    color: var(--brass-bright);
  }
  .enter-sub {
    font-family: 'Courier New', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: rgba(239, 231, 214, 0.5);
    text-align: center;
    line-height: 2;
    opacity: 0;
    animation: fadeUp 1.2s .8s ease forwards;
  }
  .enter-btn {
    margin-top: 1rem;
    font-family: 'Courier New', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--brass-bright);
    background: transparent;
    border: 1px solid rgba(176,141,87,0.5);
    padding: 1rem 2.6rem;
    cursor: none;
    opacity: 0;
    animation: fadeUp 1.2s 1.1s ease forwards;
    transition: background .4s ease, color .4s ease, border-color .4s ease;
  }
  .enter-btn:hover {
    background: var(--brass-bright);
    color: var(--desk);
    border-color: var(--brass-bright);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     RESPONSIVE — collapse the book to a single page on mobile
     ============================================================ */
  @media (max-width: 820px) {
    .book {
      width: 88vw;
      height: 82vh;
    }
    .page-left { display: none; }
    .page-right { width: 100%; border-radius: 4px; }
    .spine { display: none; }
    .bookmarks {
      right: 1rem;
      gap: 0.5rem;
    }
    .bookmark .bm-label { display: none; }
    .bookmark.active .bm-label { display: none; }
    .topbar { padding: 1.4rem 1.4rem; }
    .turn-hint { font-size: 0.55rem; bottom: 1.6rem; }
    .cursor-lens, .cursor-pin { display: none; }
    .chapter-body { font-size: 1.05rem; }
  }
</style>
</head>
<body>

  <!-- Cursor: brass reading lens -->
  <div class="cursor-lens" id="cursorLens"></div>
  <div class="cursor-pin" id="cursorPin"></div>

  <!-- Desk scene -->
  <div class="desk"></div>

  <!-- Top bar -->
  <div class="topbar">
    <a href="#" class="brand" id="brand">Lucky <em>Kumar</em></a>
    <div class="pagination" id="pagination">Chapter I of VII</div>
  </div>

  <!-- Bookmarks -->
  <nav class="bookmarks" id="bookmarks" aria-label="Chapters"></nav>

  <!-- THE BOOK -->
  <div class="book" id="book">
    <div class="book-shadow"></div>

    <!-- Left page — chapters with even index (0, 2, 4, 6) -->
    <div class="page page-left" id="pageLeft"></div>

    <!-- Right page — chapters with odd index (1, 3, 5) -->
    <div class="page page-right" id="pageRight"></div>

    <!-- Spine -->
    <div class="spine"></div>
  </div>

  <!-- Page-turn hint -->
  <div class="turn-hint" id="turnHint">Scroll to turn</div>

  <!-- Enter screen -->
  <div class="enter-screen" id="enterScreen">
    <div class="enter-eyebrow">A Portfolio, Bound</div>
    <div class="enter-title">The Studio<br><em>Book</em></div>
    <div class="enter-sub">Frontend · Backend · Adobe · Copy<br>Lucky Kumar, MMXXV</div>
    <button class="enter-btn" id="enterBtn">Open</button>
  </div>

<script>
(function () {
  'use strict';

  // ============================================================
  // CURSOR
  // ============================================================
  const lens = document.getElementById('cursorLens');
  const pin = document.getElementById('cursorPin');
  let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  let lensX = mouseX, lensY = mouseY;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
  });

  function animateCursor() {
    pin.style.left = mouseX + 'px';
    pin.style.top = mouseY + 'px';
    lensX += (mouseX - lensX) * 0.2;
    lensY += (mouseY - lensY) * 0.2;
    lens.style.left = lensX + 'px';
    lens.style.top = lensY + 'px';
    requestAnimationFrame(animateCursor);
  }
  animateCursor();

  document.addEventListener('mousedown', () => document.body.classList.add('clicking'));
  document.addEventListener('mouseup', () => document.body.classList.remove('clicking'));
  document.addEventListener('mouseleave', () => { lens.style.opacity = '0'; pin.style.opacity = '0'; });
  document.addEventListener('mouseenter', () => { lens.style.opacity = '1'; pin.style.opacity = '1'; });

  // ============================================================
  // CHAPTER CONTENT
  // Each chapter belongs to one page side:
  //   index 0 → left page (title page)
  //   index 1 → right page
  //   index 2 → left page
  //   index 3 → right page
  //   index 4 → left page
  //   index 5 → right page
  //   index 6 → left page
  //
  // When a chapter is active, its sibling page shows the adjacent
  // chapter (so both pages of an open book have content).
  // ============================================================
  const chapters = [
    {
      kind: 'title',
      folio: 'Chapter I',
      title: 'Lucky<br>Kumar<em>.</em>',
      body: null,
      titlePage: {
        eyebrow: 'The Studio Book',
        main: 'Lucky<br>Kumar<em>.</em>',
        rule: true,
        sub: 'Four disciplines. One point of view.<br>Frontend · Backend · Adobe · Copy.',
        imprint: 'Est. MMXXV — Selected Work'
      }
    },
    {
      kind: 'chapter',
      folio: 'Chapter II — Frontend',
      title: 'The <em>surface</em><br>of things.',
      body: 'Interfaces built with intent. Clean semantics, fluid motion, and performance that stays out of the way. Every transition is a decision. The surface is where the work meets the person.',
      list: [
        ['HTML · CSS · JS', 'Core'],
        ['Motion design', 'Craft'],
        ['Accessibility', 'Practice'],
        ['Performance', 'Discipline']
      ]
    },
    {
      kind: 'chapter',
      folio: 'Chapter III — Backend',
      title: 'The <em>structure</em><br>underneath.',
      body: 'APIs, data models, and architecture that scale quietly. The invisible work that makes the visible work possible. If frontend is the surface, backend is the reason the surface holds.',
      list: [
        ['APIs', 'Design'],
        ['Databases', 'Modelling'],
        ['Authentication', 'Security'],
        ['Architecture', 'Systems']
      ]
    },
    {
      kind: 'chapter',
      folio: 'Chapter IV — Adobe',
      title: 'The <em>form</em><br>of feeling.',
      body: 'Design that respects the grid but knows when to break it. From brand systems to pixel-perfect composition, every element earns its place. Form is what makes a thing feel inevitable.',
      list: [
        ['Photoshop', 'Image'],
        ['Illustrator', 'Vector'],
        ['InDesign', 'Editorial'],
        ['Brand systems', 'Identity']
      ]
    },
    {
      kind: 'chapter',
      folio: 'Chapter V — Copy',
      title: 'The <em>voice</em><br>of the thing.',
      body: 'Words that carry weight. Every headline, every line of microcopy — written to be read, not skimmed. Clarity first, rhythm always. Copy is what turns a thing into a story.',
      list: [
        ['Headlines', 'Hook'],
        ['Microcopy', 'Guidance'],
        ['Brand voice', 'Tone'],
        ['Story', 'Narrative']
      ]
    },
    {
      kind: 'quote',
      folio: 'Chapter VI',
      title: 'On <em>range</em>.',
      body: 'A jack of all trades is rarely a master of none — when the trades inform each other, the work becomes something none of them could produce alone. Range is not dilution. Range is compounding.',
      attr: '— Lucky Kumar, on the value of range'
    },
    {
      kind: 'contact',
      folio: 'Chapter VII — Colophon',
      title: 'Let\'s build<br>something <em>considered.</em>',
      body: 'Open to thoughtful projects, collaborations, and conversations. Reach out — I reply to everything.',
      email: 'hello@luckykumar.dev'
    }
  ];

  const TOTAL = chapters.length;

  // ============================================================
  // BUILD CHAPTER DOM — one <section> per chapter, split between pages
  // ============================================================
  const pageLeft = document.getElementById('pageLeft');
  const pageRight = document.getElementById('pageRight');

  function buildChapterHTML(ch, idx) {
    if (ch.kind === 'title') {
      return `
        <div class="chapter title-page" data-chapter="${idx}">
          <div class="folio">${ch.titlePage.eyebrow}</div>
          <div class="title-main">${ch.titlePage.main}</div>
          ${ch.titlePage.rule ? '<div class="title-rule"></div>' : ''}
          <div class="title-sub">${ch.titlePage.sub}</div>
          <div class="title-imprint">${ch.titlePage.imprint}</div>
        </div>
      `;
    }
    if (ch.kind === 'quote') {
      return `
        <div class="chapter" data-chapter="${idx}">
          <div class="folio">${ch.folio}</div>
          <h2 class="chapter-title">${ch.title}</h2>
          <div class="chapter-rule"></div>
          <p class="chapter-body" style="font-style:italic;font-size:1.2rem;line-height:1.6;max-width:38ch;">${ch.body}</p>
          <p style="margin-top:auto;font-family:'Courier New',monospace;font-size:0.66rem;letter-spacing:0.22em;color:var(--muted);text-transform:uppercase;">${ch.attr}</p>
        </div>
      `;
    }
    if (ch.kind === 'contact') {
      return `
        <div class="chapter" data-chapter="${idx}">
          <div class="folio">${ch.folio}</div>
          <h2 class="chapter-title">${ch.title}</h2>
          <div class="chapter-rule"></div>
          <p class="chapter-body">${ch.body}</p>
          <a href="mailto:${ch.email}" class="contact-link">${ch.email}</a>
        </div>
      `;
    }
    // default chapter
    const listHTML = (ch.list || []).map(([name, note]) =>
      `<li><span>${name}</span><span>${note}</span></li>`
    ).join('');
    return `
      <div class="chapter" data-chapter="${idx}">
        <div class="folio">${ch.folio}</div>
        <h2 class="chapter-title">${ch.title}</h2>
        <div class="chapter-rule"></div>
        <p class="chapter-body drop-cap">${ch.body}</p>
        ${listHTML ? `<ul class="index-list">${listHTML}</ul>` : ''}
      </div>
    `;
  }

  // Left page gets even-index chapters; right page gets odd-index chapters
  chapters.forEach((ch, i) => {
    const target = (i % 2 === 0) ? pageLeft : pageRight;
    target.insertAdjacentHTML('beforeend', buildChapterHTML(ch, i));
  });

  const chapterEls = Array.from(document.querySelectorAll('.chapter'));

  // ============================================================
  // BOOKMARKS
  // ============================================================
  const bookmarksEl = document.getElementById('bookmarks');
  const chapterLabels = ['Title', 'Frontend', 'Backend', 'Adobe', 'Copy', 'On Range', 'Contact'];

  chapters.forEach((ch, i) => {
    const b = document.createElement('button');
    b.className = 'bookmark' + (i === 0 ? ' active' : '');
    b.innerHTML = `<span class="bm-label">${chapterLabels[i]}</span><span class="bm-line"></span>`;
    b.setAttribute('aria-label', chapterLabels[i]);
    b.addEventListener('click', () => goToChapter(i));
    b.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
    b.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    bookmarksEl.appendChild(b);
  });
  const bookmarkEls = bookmarksEl.querySelectorAll('.bookmark');

  // ============================================================
  // STATE
  // ============================================================
  let current = 0;
  let target = 0;
  let isTurning = false;
  let hasEntered = false;
  let accumulated = 0;
  let idleTimer = null;
  const THRESHOLD = 80;

  const pagination = document.getElementById('pagination');
  const turnHint = document.getElementById('turnHint');
  const enterScreen = document.getElementById('enterScreen');
  const enterBtn = document.getElementById('enterBtn');
  const book = document.getElementById('book');

  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  function updateMeta() {
    pagination.textContent = `Chapter ${ROMAN[current]} of VII`;
    bookmarkEls.forEach((b, i) => b.classList.toggle('active', i === current));
  }

  // ============================================================
  // PAGE VISIBILITY — set which chapter is visible on each page
  // For a given open position `current`, the left page shows the
  // highest even index ≤ current, the right page shows the highest
  // odd index ≤ current. (The "spread" of the open book.)
  // ============================================================
  function getSpread(c) {
    // The current chapter determines the spread.
    // Even chapters are on the left page (and the right page shows c+1 if exists).
    // Odd chapters are on the right page (and the left page shows c-1 if exists).
    if (c % 2 === 0) {
      const left = c;
      const right = (c + 1 < TOTAL) ? c + 1 : -1;
      return { left, right };
    } else {
      const right = c;
      const left = (c - 1 >= 0) ? c - 1 : -1;
      return { left, right };
    }
  }

  function showSpread(spread) {
    chapterEls.forEach((el) => {
      const idx = parseInt(el.dataset.chapter, 10);
      const visible = (idx === spread.left || idx === spread.right);
      el.classList.toggle('active', visible);
    });
  }

  // ============================================================
  // PAGE TURN — a full 3D flip on the turning page
  // ============================================================
  function goToChapter(index) {
    if (isTurning || index === current) return;
    if (index < 0 || index >= TOTAL) return;

    isTurning = true;
    turnHint.classList.add('hide');

    const goingForward = index > current;

    // Which page turns? If we're going forward from an even chapter,
    // the left page turns (it's the "current" spread's left page opening
    // to reveal the next spread). We'll simplify: the page that turns is
    // the one that currently shows the OUTGOING chapter.
    const outgoingIsEven = current % 2 === 0;
    const turningPage = outgoingIsEven ? pageLeft : pageRight;

    // Direction: forward = rotate to the right (for left page) or left (for right page)
    // Actually, a page flip always rotates toward the opposite page, around the spine.
    // For the left page turning right: rotateY from 0 to +180deg
    // For the right page turning left: rotateY from 0 to -180deg
    let targetRotate = 0;
    if (turningPage === pageLeft) {
      targetRotate = 180;
    } else {
      targetRotate = -180;
    }

    // Fade in the incoming spread BEFORE the turn finishes so it's
    // already there when the turning page lands.
    const incomingSpread = getSpread(index);
    // We need to show the incoming spread's content on the turning page's
    // "other side." The simplest robust approach: mid-flip (at 90deg),
    // swap the chapters visible on the pages, then finish the flip.
    // This is what a real page turn does.

    // Add a temporary flipping class that removes shadow during flip
    turningPage.style.transition = 'transform .9s cubic-bezier(.65,0,.35,1), box-shadow .9s ease';
    turningPage.style.zIndex = '20';
    turningPage.style.boxShadow = '0 0 80px rgba(0,0,0,0.6)';

    // Kick off the rotation
    requestAnimationFrame(() => {
      turningPage.style.transform = `rotateY(${targetRotate}deg)`;
    });

    // At the midpoint of the flip, swap the visible chapters
    const halfDuration = 450;
    setTimeout(() => {
      // Now show the new spread on the pages
      showSpread(incomingSpread);
      // The turning page is now "back side facing us" — reset its content
      // (it will show whatever chapter is on it in the new spread).
      // No action needed: showSpread already toggled the active class.
    }, halfDuration);

    // When the flip finishes, reset the turning page transform (so future
    // flips can reuse it), update state, and re-enable interaction.
    setTimeout(() => {
      turningPage.style.transition = 'none';
      turningPage.style.transform = 'rotateY(0deg)';
      turningPage.style.zIndex = '';
      turningPage.style.boxShadow = '';

      // Small delay to let the browser settle, then re-enable transitions
      requestAnimationFrame(() => {
        turningPage.style.transition = 'transform 1.1s cubic-bezier(.7,0,.3,1), box-shadow 1.1s cubic-bezier(.7,0,.3,1)';
        current = index;
        updateMeta();
        isTurning = false;
      });
    }, 900);
  }

  // ============================================================
  // WHEEL — accumulation with threshold commit
  // ============================================================
  function handleWheel(e) {
    if (!hasEntered) return;
    e.preventDefault();
    if (isTurning) return;

    let delta = e.deltaY;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) delta = e.deltaX;
    accumulated += delta;

    if (Math.abs(accumulated) >= THRESHOLD) {
      const dir = accumulated > 0 ? 1 : -1;
      const next = Math.max(0, Math.min(TOTAL - 1, current + dir));
      accumulated = 0;
      if (next !== current) {
        goToChapter(next);
      }
    }

    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      accumulated = 0;
    }, 180);
  }

  // ============================================================
  // KEYBOARD
  // ============================================================
  function handleKey(e) {
    if (!hasEntered) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        enterExperience();
      }
      return;
    }
    if (isTurning) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      goToChapter(current + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      goToChapter(current - 1);
    } else if (e.key === 'Home') {
      e.preventDefault();
      goToChapter(0);
    } else if (e.key === 'End') {
      e.preventDefault();
      goToChapter(TOTAL - 1);
    }
  }

  // ============================================================
  // TOUCH
  // ============================================================
  let touchStartX = 0, touchStartY = 0, touchMoved = false;
  function handleTouchStart(e) {
    if (!hasEntered) return;
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    touchMoved = false;
  }
  function handleTouchMove(e) {
    if (!hasEntered || isTurning) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
    if (Math.abs(dx) > Math.abs(dy)) e.preventDefault();
  }
  function handleTouchEnd(e) {
    if (!hasEntered || isTurning || !touchMoved) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      dx < 0 ? goToChapter(current + 1) : goToChapter(current - 1);
    } else if (Math.abs(dy) > 50) {
      dy < 0 ? goToChapter(current + 1) : goToChapter(current - 1);
    }
  }

  // ============================================================
  // ENTER
  // ============================================================
  function enterExperience() {
    if (hasEntered) return;
    hasEntered = true;
    enterScreen.classList.add('gone');
    showSpread(getSpread(0));
    updateMeta();
  }
  enterBtn.addEventListener('click', enterExperience);

  // ============================================================
  // BIND
  // ============================================================
  window.addEventListener('wheel', handleWheel, { passive: false });
  window.addEventListener('keydown', handleKey);
  window.addEventListener('touchstart', handleTouchStart, { passive: true });
  window.addEventListener('touchmove', handleTouchMove, { passive: false });
  window.addEventListener('touchend', handleTouchEnd, { passive: true });
  document.getElementById('brand').addEventListener('click', (e) => {
    e.preventDefault();
    goToChapter(0);
  });

  // Init
  showSpread(getSpread(0));
  updateMeta();

})();
</script>
</body>
</html>
